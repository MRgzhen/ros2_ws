# This config file is used by ros2_control
# G2（genie）：双臂/躯干/头部 JTC + 双夹爪 GripperAction
# mimic 联动参数定义在 g2bot_description 的 ros2_control xacro 中
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    body_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_l_controller:
      type: position_controllers/GripperActionController

    gripper_r_controller:
      type: position_controllers/GripperActionController

body_controller:
  ros__parameters:
    joints:
      - idx01_body_joint1
      - idx02_body_joint2
      - idx03_body_joint3
      - idx04_body_joint4
      - idx05_body_joint5
    command_interfaces:
      - position
    state_interfaces:
      - position

head_controller:
  ros__parameters:
    joints:
      - idx11_head_joint1
      - idx12_head_joint2
      - idx13_head_joint3
    command_interfaces:
      - position
    state_interfaces:
      - position

left_arm_controller:
  ros__parameters:
    joints:
      - idx21_arm_l_joint1
      - idx22_arm_l_joint2
      - idx23_arm_l_joint3
      - idx24_arm_l_joint4
      - idx25_arm_l_joint5
      - idx26_arm_l_joint6
      - idx27_arm_l_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position

right_arm_controller:
  ros__parameters:
    joints:
      - idx61_arm_r_joint1
      - idx62_arm_r_joint2
      - idx63_arm_r_joint3
      - idx64_arm_r_joint4
      - idx65_arm_r_joint5
      - idx66_arm_r_joint6
      - idx67_arm_r_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position

gripper_l_controller:
  ros__parameters:
    joint: idx31_gripper_l_inner_joint1

gripper_r_controller:
  ros__parameters:
    joint: idx71_gripper_r_inner_joint1
